name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least-privilege default: none of these jobs write anything, only read the
# checkout and lint/scan it. Overridden per-job if a future job needs more.
permissions:
  contents: read

jobs:
  yaml-lint:
    name: Validate skill YAML files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install yamllint
        run: pip install yamllint

      - name: Lint YAML files
        run: |
          yamllint -d "{
            extends: default,
            rules: {
              line-length: {max: 200},
              truthy: disable,
              comments: disable
            }
          }" .project/skills/

  markdown-lint:
    name: Validate markdown files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Lint markdown
        uses: DavidAnson/markdownlint-cli2-action@8de2aa07cae85fd17c0b35642db70cf5495f1d25 # v24.0.0
        with:
          globs: |
            **/*.md
            !node_modules/**
            !vendor/**

  secret-scan:
    name: Secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: TruffleHog
        uses: trufflesecurity/trufflehog@27b0417c16317ca9a472a9a8092acce143b49c55 # v3.95.9
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          extra_args: --only-verified
